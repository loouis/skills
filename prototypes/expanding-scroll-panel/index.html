<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8e8e6">
  <title>Expanding panel — Scroll study 01</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <main>
    <div class="transition-stage" data-stage>
      <section class="previous-section" aria-labelledby="intro-title">
        <div class="intro-content content-width">
          <h1 id="intro-title">A little space.<br>A bigger entrance.</h1>
          <div class="previous-cards" aria-hidden="true">
            <div class="previous-card"><div class="orbit"></div></div>
            <div class="previous-card"><div class="stack"><i></i><i></i><i></i></div></div>
            <div class="previous-card"><div class="steps"><i></i><i></i><i></i><i></i></div></div>
          </div>
        </div>
      </section>

      <section class="expanding-panel" data-panel aria-labelledby="panel-title">
        <!-- Only this empty surface changes shape. Content is its sibling. -->
        <div class="panel-surface" data-surface aria-hidden="true"></div>
        <div class="panel-content content-width" data-content>
          <h2 id="panel-title">Good ideas deserve room to grow.</h2>
          <div class="feature-grid">
            <article class="feature-card">
              <h3>A small beginning.<br>A wider possibility.</h3>
            </article>
            <article class="feature-card">
              <h3>Everything stays<br>right where it belongs.</h3>
            </article>
            <article class="feature-card blue-card">
              <h3>One continuous<br>change of scene.</h3>
            </article>
          </div>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
